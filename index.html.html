<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI PDF to HTML</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#0e1c2e;--line:#233c57;--text:#eef7ff;--muted:#9fb2c8;--a:#20bdf2;--b:#7a59f2;--ok:#42d59b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#0b587044,transparent 35%),radial-gradient(circle at 90% 5%,#4a2ba544,transparent 32%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1450px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:13px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--a),var(--b))}h1{margin:0;font-size:clamp(1.35rem,3vw,2rem)}header p{margin:4px 0 0;color:var(--muted)}.badge{color:var(--ok);border:1px solid #42d59b44;background:#42d59b12;border-radius:999px;padding:9px 13px}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}.card{background:#0e1c2eee;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px #0005}.side{padding:18px;height:max-content}.drop{display:grid;place-items:center;text-align:center;min-height:205px;padding:24px;border:2px dashed #20bdf266;border-radius:18px;background:linear-gradient(135deg,#20bdf20c,#7a59f20c);cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--a);transform:translateY(-2px)}.drop input{display:none}.drop .icon{font-size:40px}.drop small,.help{color:var(--muted);line-height:1.45}.file{display:none;margin-top:12px;padding:12px;background:#081524;border-radius:12px;word-break:break-word}.block{margin-top:18px}.block h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}label.field{display:block;margin:11px 0}label.field span{display:block;color:var(--muted);font-size:.82rem;margin-bottom:6px}input,select,textarea,button{font:inherit}input[type=text],input[type=password],select{width:100%;padding:10px;border-radius:11px;border:1px solid var(--line);background:#071421;color:var(--text)}.check{display:flex;gap:9px;align-items:center;margin:11px 0;font-size:.9rem}.check input{accent-color:var(--a)}button{border:0;border-radius:12px;padding:10px 13px;color:white;background:#1a314b;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.14)}button:disabled{opacity:.45;cursor:not-allowed}.primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--a),var(--b))}.clear{width:100%;margin-top:8px;background:#ff6b7a18;color:#ff9aa5;border:1px solid #ff6b7a33}.work{overflow:hidden}.bar{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs,.actions{display:flex;gap:7px}.tab{background:transparent;color:var(--muted)}.tab.active{color:white;background:#20bdf21b}.download{background:linear-gradient(135deg,#16a978,#307fc4)}.progress{height:5px;background:#071421}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:.2s}.panel{display:none;height:650px}.panel.active{display:block}iframe,textarea{width:100%;height:100%;border:0}iframe{background:white}textarea{resize:none;padding:18px;background:#07111f;color:#dcecff;font:14px/1.55 Consolas,monospace}.status{display:flex;justify-content:space-between;padding:11px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}.error{color:#ff98a4}.ai{display:none}@media(max-width:880px){.grid{grid-template-columns:1fr}.badge{display:none}.panel{height:540px}}
</style>
</head>
<body><main class="app">
<header><div class="brand"><div class="logo">PDF</div><div><h1>AI PDF to HTML</h1><p>Open-source, privacy-first μετατροπέας</p></div></div><div class="badge">Τοπική επεξεργασία PDF</div></header>
<div class="grid">
<aside class="card side">
<label class="drop" id="drop"><div><div class="icon">⬆️</div><b>Ρίξτε το PDF εδώ</b><br><small>ή πατήστε για επιλογή αρχείου</small></div><input id="file" type="file" accept="application/pdf,.pdf"></label>
<div class="file" id="fileInfo"></div>
<div class="block"><h2>Μετατροπή</h2><label class="field"><span>Μορφή εξόδου</span><select id="mode"><option value="semantic">Semantic HTML</option><option value="layout">Διατήρηση διάταξης</option><option value="plain">Απλό HTML</option></select></label><label class="check"><input id="meta" type="checkbox" checked> Metadata εγγράφου</label><label class="check"><input id="breaks" type="checkbox" checked> Αλλαγή σελίδας</label></div>
<div class="block"><h2>Προαιρετικό τοπικό AI</h2><label class="check"><input id="useAI" type="checkbox"> Βελτίωση με LLM</label><div class="ai" id="ai"><label class="field"><span>OpenAI-compatible endpoint</span><input id="endpoint" type="text" value="http://localhost:11434/v1/chat/completions"></label><label class="field"><span>Model</span><input id="model" type="text" value="qwen2.5:7b"></label><label class="field"><span>API key</span><input id="key" type="password" placeholder="προαιρετικό"></label></div><p class="help">Χωρίς AI, όλα γίνονται στον browser. Με AI, το εξαγόμενο κείμενο αποστέλλεται μόνο στο endpoint που ορίζετε.</p></div>
<button class="primary" id="convert" disabled>Μετατροπή σε HTML</button><button class="clear" id="clear">Καθαρισμός</button>
</aside>
<section class="card work"><div class="bar"><div class="tabs"><button class="tab active" data-id="preview">Προεπισκόπηση</button><button class="tab" data-id="code">HTML</button><button class="tab" data-id="text">Κείμενο</button></div><div class="actions"><button id="copy" disabled>Αντιγραφή</button><button class="download" id="download" disabled>Λήψη .html</button></div></div><div class="progress"><i id="progress"></i></div><div class="panel active" id="preview"><iframe id="frame" sandbox="allow-same-origin"></iframe></div><div class="panel" id="code"><textarea id="html"></textarea></div><div class="panel" id="text"><textarea id="raw"></textarea></div><div class="status"><span id="status">Έτοιμο για PDF</span><span id="stats">0 σελίδες • 0 χαρακτήρες</span></div></section>
</div></main>
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
const $=id=>document.getElementById(id),state={file:null,html:"",text:""};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function status(t,p=0,err=false){$("status").textContent=t;$("status").className=err?"error":"";$("progress").style.width=p+"%"}
function choose(f){if(!f)return;if(f.type!=="application/pdf"&&!f.name.toLowerCase().endsWith(".pdf")){status("Επιλέξτε αρχείο PDF",0,true);return}state.file=f;$("fileInfo").style.display="block";$("fileInfo").textContent=`${f.name} • ${(f.size/1048576).toFixed(2)} MB`;$("convert").disabled=false;status("Το PDF είναι έτοιμο")}
$("file").onchange=e=>choose(e.target.files[0]);["dragenter","dragover"].forEach(n=>$("drop").addEventListener(n,e=>{e.preventDefault();$("drop").classList.add("drag")}));["dragleave","drop"].forEach(n=>$("drop").addEventListener(n,e=>{e.preventDefault();$("drop").classList.remove("drag")}));$("drop").ondrop=e=>choose(e.dataTransfer.files[0]);$("useAI").onchange=e=>$("ai").style.display=e.target.checked?"block":"none";
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");$(b.dataset.id).classList.add("active")});
function lines(items){const rows=[];[...items].sort((a,b)=>Math.abs(b.transform[5]-a.transform[5])>3?b.transform[5]-a.transform[5]:a.transform[4]-b.transform[4]).forEach(i=>{let r=rows.find(x=>Math.abs(x.y-i.transform[5])<3.5);if(!r){r={y:i.transform[5],a:[]};rows.push(r)}r.a.push(i)});return rows.sort((a,b)=>b.y-a.y).map(r=>r.a.sort((a,b)=>a.transform[4]-b.transform[4]))}
function semantic(items,n){const ls=lines(items),sizes=items.map(i=>Math.abs(i.transform[0])||12).sort((a,b)=>a-b),m=sizes[Math.floor(sizes.length/2)]||12;return `<section class="page" data-page="${n}">`+ls.map(l=>{const t=l.map(i=>i.str).join(" ").replace(/\s+/g," ").trim(),z=Math.max(...l.map(i=>Math.abs(i.transform[0])||m));if(!t)return"";if(z>m*1.6)return`<h1>${esc(t)}</h1>`;if(z>m*1.28)return`<h2>${esc(t)}</h2>`;return`<p>${esc(t)}</p>`}).join("\n")+"</section>"}
function layout(items,v,n){return `<section class="page fixed" data-page="${n}" style="width:${v.width}px;height:${v.height}px">`+items.filter(i=>i.str.trim()).map(i=>{const z=Math.max(8,Math.abs(i.transform[0])||12),y=v.height-i.transform[5]-z;return`<span style="left:${i.transform[4]}px;top:${y}px;font-size:${z}px">${esc(i.str)}</span>`}).join("")+"</section>"}
function documentHTML(body,title,mode,pages){const fixed=mode==="layout"?".fixed{position:relative;margin:20px auto;background:#fff;box-shadow:0 4px 20px #0002;overflow:hidden}.fixed span{position:absolute;white-space:pre}":"";return `<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${$("meta").checked?`<meta name="generator" content="AI PDF to HTML"><meta name="source-pages" content="${pages}">`:""}<title>${esc(title)}</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#182236;font:16px/1.65 Arial,sans-serif}.doc{max-width:${mode==="layout"?"none":"900px"};margin:auto;padding:26px}.page:not(.fixed){background:#fff;margin:0 0 24px;padding:40px;border-radius:12px;box-shadow:0 4px 20px #0001}${$("breaks").checked?".page{break-after:page}.page:last-child{break-after:auto}":""}${fixed}</style></head><body><main class="doc">${body}</main></body></html>`}
async function aiImprove(text){const headers={"Content-Type":"application/json"};if($("key").value.trim())headers.Authorization=`Bearer ${$("key").value.trim()}`;const r=await fetch($("endpoint").value.trim(),{method:"POST",headers,body:JSON.stringify({model:$("model").value.trim(),messages:[{role:"user",content:`Convert this extracted PDF text to clean semantic HTML body content. Preserve language and facts. Return only HTML, no scripts or markdown.\n\n${text.slice(0,60000)}`}],temperature:.1})});if(!r.ok)throw Error(`LLM HTTP ${r.status}`);const j=await r.json();return(j.choices?.[0]?.message?.content||"").replace(/^```html\s*|```$/g,"").trim()}
$("convert").onclick=async()=>{if(!state.file)return;$("convert").disabled=true;try{status("Φόρτωση PDF...",5);const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await state.file.arrayBuffer())}).promise,parts=[],txt=[],mode=$("mode").value;for(let n=1;n<=pdf.numPages;n++){status(`Σελίδα ${n} από ${pdf.numPages}`,8+n/pdf.numPages*72);const p=await pdf.getPage(n),v=p.getViewport({scale:1.25}),c=await p.getTextContent(),t=lines(c.items).map(l=>l.map(i=>i.str).join(" ").replace(/\s+/g," ").trim()).filter(Boolean).join("\n");txt.push(`--- Σελίδα ${n} ---\n${t}`);parts.push(mode==="layout"?layout(c.items,v,n):mode==="plain"?`<section class="page"><p>${esc(t).replace(/\n/g,"<br>")}</p></section>`:semantic(c.items,n))}state.text=txt.join("\n\n");let body=parts.join("\n");if($("useAI").checked){status("Βελτίωση με τοπικό LLM...",86);body=`<section class="page">${await aiImprove(state.text)}</section>`}state.html=documentHTML(body,state.file.name.replace(/\.pdf$/i,""),mode,pdf.numPages);$("html").value=state.html;$("raw").value=state.text;$("frame").srcdoc=state.html;$("stats").textContent=`${pdf.numPages} σελίδες • ${state.text.length.toLocaleString("el-GR")} χαρακτήρες`;$("copy").disabled=$("download").disabled=false;status("Η μετατροπή ολοκληρώθηκε",100)}catch(e){console.error(e);status(`Σφάλμα: ${e.message}`,0,true)}finally{$("convert").disabled=false}};
$("html").oninput=e=>{$("frame").srcdoc=state.html=e.target.value};$("copy").onclick=async()=>{await navigator.clipboard.writeText(state.html);status("Το HTML αντιγράφηκε",100)};$("download").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([state.html],{type:"text/html;charset=utf-8"}));a.download=(state.file?.name||"converted").replace(/\.pdf$/i,"")+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("clear").onclick=()=>location.reload();
</script></body></html>
